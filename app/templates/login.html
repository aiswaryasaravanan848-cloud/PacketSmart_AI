{% extends 'base.html' %}{% block content %}<div class="auth"><form id="loginForm" class="panel"><p class="eyebrow">WELCOME BACK</p><h1>Login</h1><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn primary" type="submit">Login</button><p>New here? <a href="/register">Create an account</a></p></form></div>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(r.ok)location.href='/dashboard';else showToast(d.detail||'Login failed');});</script>{% endblock %}
