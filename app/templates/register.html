{% extends 'base.html' %}{% block content %}<div class="auth"><form id="registerForm" class="panel"><p class="eyebrow">GET STARTED</p><h1>Create account</h1><label>Name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="btn primary" type="submit">Register</button><p>Already registered? <a href="/login">Login</a></p></form></div>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(r.ok)location.href='/dashboard';else showToast(d.detail||'Registration failed');});</script>{% endblock %}
