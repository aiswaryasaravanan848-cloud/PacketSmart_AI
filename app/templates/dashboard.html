{% extends 'base.html' %}{% block content %}<section class="section"><div class="section-head"><div><p class="eyebrow">YOUR SPACE</p><h1 id="hello">Dashboard</h1><p id="count" class="muted"></p></div><button class="btn ghost" onclick="logout()">Logout</button></div><div class="cards"><a class="card" href="/planner/home"><span>🏠</span><h3>Home Planner</h3><p>Build a room plan.</p></a><a class="card" href="/planner/party"><span>🎉</span><h3>Party Planner</h3><p>Balance an event budget.</p></a><a class="card" href="/planner/jewelry"><span>💎</span><h3>Jewelry Planner</h3><p>Find occasion-ready ideas.</p></a></div></section>{% endblock %}{% block scripts %}<script>async function load(){const r=await fetch('/session-data');if(!r.ok){location.href='/login';return}const d=await r.json();document.getElementById('hello').textContent='Hi, '+d.user.name;document.getElementById('count').textContent=d.recommendation_count+' saved recommendation(s).'}async function logout(){await fetch('/logout',{method:'POST'});location.href='/'}load();</script>{% endblock %}
